<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Import Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .column {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
        }

        h2 {
            margin-top: 0;
        }

        .user {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            font-size: 16px;
        }

        #auditDetails {
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h1>User Import Dashboard</h1>

    <div class="dashboard">

        <!-- USERS COLUMN -->
        <div class="column">
            <h2>Users</h2>

            <div id="users">
                Loading users...
            </div>
        </div>


        <!-- AUDITS COLUMN -->
        <div class="column">
            <h2>Audits</h2>

            <label for="auditSelect">
                Select timestamp:
            </label>

            <select id="auditSelect">
                <option value="">Select an audit</option>
            </select>

            <div id="auditDetails"></div>
        </div>

    </div>


    <script>

        // USERS

        fetch("/directory.json")
            .then(response => response.json())
            .then(users => {

                const usersContainer = document.getElementById("users");

                usersContainer.innerHTML = "";

                users.forEach(user => {

                    const div = document.createElement("div");

                    div.className = "user";

                    div.textContent = `${user.id} - ${user.name}`;

                    usersContainer.appendChild(div);
                });

            })
            .catch(error => {

                console.error("Failed to load users:", error);

                document.getElementById("users").textContent =
                    "Failed to load users.";
            });


        // =========================
        // AUDITS
        // =========================

        const auditSelect = document.getElementById("auditSelect");

        const auditDetails = document.getElementById("auditDetails");


        // Ask Node.js for all audit files

        fetch("/api/audits")
            .then(response => response.json())
            .then(audits => {

                audits.forEach(audit => {

                    const option = document.createElement("option");

                    // The actual filename is used internally
                    option.value = audit.fileName;

                    // The timestamp is what the user sees
                    option.textContent = audit.timestamp;

                    auditSelect.appendChild(option);
                });

            })
            .catch(error => {

                console.error("Failed to load audits:", error);

                auditDetails.textContent =
                    "Failed to load audits.";
            });


        // WHEN AN AUDIT IS SELECTED

        auditSelect.addEventListener("change", () => {

            const fileName = auditSelect.value;


            // Nothing selected

            if (!fileName) {

                auditDetails.innerHTML = "";

                return;
            }


            // Load the selected audit

            fetch(`/audits/${fileName}`)
                .then(response => response.json())
                .then(audit => {

                    auditDetails.innerHTML = `
                        <p>
                            <strong>Timestamp:</strong>
                            ${audit.timestamp}
                        </p>

                        <p>
                            <strong>Imported:</strong>
                            ${audit.imported}
                        </p>

                        <p>
                            <strong>Skipped:</strong>
                            ${audit.skipped}
                        </p>
                    `;

                })
                .catch(error => {

                    console.error("Failed to load audit:", error);

                    auditDetails.textContent =
                        "Failed to load audit.";
                });

        });

    </script>

</body>
</html>
